# Install as /etc/systemd/system/legal-harness-a.service.d/80-usage-store.conf
# First create this directory as cta:cta with mode 0700. Keep it outside releases.
[Service]
Environment=TAXLAB_USAGE_DB=/home/cta/.local/state/legal-harness-usage/usage.sqlite
ReadWritePaths=/home/cta/.local/state/legal-harness-usage
