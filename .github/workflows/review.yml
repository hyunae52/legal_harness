name: Review
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: review / Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: npm run audit:runtime
      - run: npm run security:secrets
      - run: npm run review
      - run: npm run review:package
      # No production secrets, publishing, merging or deployment in this job.
      # A green PR job alone is NOT independent AI or human batch approval.
